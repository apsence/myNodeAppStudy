# MongoDB как реплика-сет из одного узла (нужен для транзакций и Change Streams).
# Запуск: docker compose up -d   (реплика-сет инициализируется автоматически healthcheck-ом)
services:
  mongo:
    image: mongo:7.0
    container_name: bbmo-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
